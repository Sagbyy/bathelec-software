name: Notion ticket → Done on merge

on:
  pull_request:
    types: [closed]

jobs:
  mark-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move linked Notion ticket to Done
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DATABASE_ID: 630ef5f65f0643c7a4290af15d2d99cd
        run: |
          set -euo pipefail

          if [ -z "${NOTION_TOKEN:-}" ]; then
            echo "NOTION_TOKEN secret is not set; skipping."
            exit 0
          fi

          KEY=$(printf '%s\n%s\n' "$PR_TITLE" "$HEAD_REF" | grep -oiE 'DTA-[0-9]+' | head -1 || true)
          if [ -z "$KEY" ]; then
            echo "No DTA-xx key found in PR title or branch name; nothing to do."
            exit 0
          fi
          NUM=$(printf '%s' "$KEY" | grep -oE '[0-9]+')
          echo "Linked ticket: DTA-$NUM"

          PAGE_ID=$(curl -sS -X POST "https://api.notion.com/v1/databases/${DATABASE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"filter\":{\"property\":\"ID\",\"unique_id\":{\"equals\":${NUM}}}}" \
            | jq -r '.results[0].id // empty')

          if [ -z "$PAGE_ID" ]; then
            echo "No Notion page found for DTA-$NUM; skipping."
            exit 0
          fi

          curl -sS -X PATCH "https://api.notion.com/v1/pages/${PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties":{"Status":{"status":{"name":"Done"}}}}' \
            | jq -e '.id' > /dev/null

          echo "DTA-$NUM moved to Done."
